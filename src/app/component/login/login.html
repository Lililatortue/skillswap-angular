<body class="container">
  <form class="form-card small" (submit)="$event.preventDefault(); Login()">
    <h1>Login into your Account</h1>

    <div class="form-group">
      <label>Email Address</label>
      <input
        type="email"
        placeholder="john@example.com"
        (input)="sanitizeEmail(emailInput.value)"
        #emailInput>
        @if (errEmail()) { <small class="error">{{ errEmail() }}</small> }
    </div>

    <div class="form-group">
      <label>Password</label>
      <input
        type="password"
        placeholder="********"
        (input)="sanitizePassword(passInput.value)"
        #passInput>
        @if (errPassword()) { <small class="error">{{ errPassword() }}</small> }
    </div>
    @if (errApi()) {
      <div class="api-error">{{ errApi() }}</div>
    }

    <a routerLink = "/register" [replaceUrl]="true">I don't have an account</a>

    <button type="submit" [disabled]="!guard()">
      login
    </button>
  </form>
</body>
