<body class="container">
  <form class="form-card small" (submit)="$event.preventDefault(); Register()">
    <h1>Create an Account</h1>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" placeholder="John Doe" (input)="sanitizeName(nameInput.value)" #nameInput>
      @if (errName()) { <small class="error">{{ errName() }}</small> }
    </div>

    <div class="form-group">
      <label>Username</label>
      <input type="text" placeholder="johndoe123" (input)="sanitizeUsername(userInput.value)" #userInput>
      @if (errUsername()) { <small class="error">{{ errUsername() }}</small> }
    </div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" placeholder="john@example.com" (input)="sanitizeEmail(emailInput.value)" #emailInput>
      @if (errEmail()) { <small class="error">{{ errEmail() }}</small> }
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" placeholder="********" (input)="sanitizePassword(passInput.value)" #passInput>
      @if (errPassword()) { <small class="error">{{ errPassword() }}</small> }
    </div>

    <div class="form-group">
      <label>Bio</label>
      <textarea placeholder="Tell us about yourself..." (input)="sanitizeBio(bioInput.value)" #bioInput></textarea>
    </div>

    <div class="form-group">
      <label>Skills (comma separated)</label>
      <input type="text" placeholder="Java, Angular, Spring" (input)="sanitizeSkills(skillsInput.value)" #skillsInput>
    </div>

    @if (errApi()) {
      <div class="api-error">{{ errApi() }}</div>
    }

    <a routerLink="/login" [replaceUrl]="true">I already have an account</a>

    <button type="submit" [disabled]="!guard()">
      Register
    </button>
  </form>
</body>
